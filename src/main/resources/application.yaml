spring:
  application:
    name: autoandes-backend
  profiles:
    # Perfil por defecto: dev. Para produccion: SPRING_PROFILES_ACTIVE=prod
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# La conexion a la base de datos y la clave de firma JWT se definen en application-dev.yaml y application-prod.yaml
app:
  jwt:
    expira-en-segundos: 3600
  cors:
    origen-permitido: http://localhost:4200

springdoc:
  swagger-ui:
    path: /swagger-ui.html
